# Legacy canonical ego-axis frame for checkpoints trained before the native LiDAR profile.
name: b2d
ar_loss_weight: 0.1           # legacy checkpoint recipe; keep the pre-profile unified default
official_command_text: true   # reproduce main's one-hot flatten read; false is an explicit ablation
frame: ego
cameras: [front, front_left, front_right, back_left, back_right, back]
view_tokens: ["<FRONT_VIEW>", "<FRONT_LEFT_VIEW>", "<FRONT_RIGHT_VIEW>", "<BACK_LEFT_VIEW>", "<BACK_RIGHT_VIEW>", "<BACK_VIEW>"]
horizon: 6
motion_steps: 6
commands: [left, right, straight, lane_follow, change_lane_left, change_lane_right]
command_prompts: ["TURN LEFT", "TURN RIGHT", "GO STRAIGHT", "LANE FOLLOW", "CHANGE LANE LEFT", "CHANGE LANE RIGHT"]
status_layout: [vel_x, acc_x, acc_y, rot_x, rot_y, steer]   # vel_x: the signed ego_vel[0] the official status reads
det_classes: [car, van, truck, bicycle, traffic_sign, traffic_cone, traffic_light, pedestrian, others]
box_range: [-55.0, -55.0, 55.0, 55.0]
box_radius: 55.0
yawless_classes: [traffic_cone]
map_classes: [Broken, Solid, SolidSolid, Center]
map_roi: [60.0, 30.0]
ground_height: -1.84023
ego_box: [0.5, 0.0, -1.095, 4.89, 1.84, 1.49, 0.0]
train_resize: 0.6              # its data_aug_conf resize_lim: 1600 x 900 -> 960 x 540, cropped to image_hw
anchors_dir: ${oc.env:UNIDRIVE_ANCHORS_ROOT,/data/yongkangli/UniDriveVLA/anchors}/b2d
delta_mean: [2.0249, 0.0222]    # the official config's delta_mu [-0.0222, 2.0249] (LiDAR x right, y forward) on the ego axes
delta_std: [1.8586, 0.6720]
zero_velocity_classes: [traffic_sign, traffic_cone, traffic_light]   # cached with zero velocity, as its instance bank
decoder_norm: false            # its unified decoder has no norm_layer: the "norm" operations are skipped
prefix_max_len: 0              # legacy trained behavior: batch-dynamic prefix
official_attention_mask: false
prompt_style: b2d              # speed / acceleration prompt, no PT_HIST
enable_knowledge_insulation: false  # explicit main ablation; includes prompt-token CE when enabled
use_hist_traj: false           # the official head has no history token
use_occ_tokens: false          # no occupancy queries in the perception stream
keypoint_from_anchor: true     # learnable points from the anchor embed
box_size_clamp: [-5.0, 5.0]
inference_attn_impl: eager
cast_inference_mask: false
detach_plan_geometry: true
summed_planning_loss: true     # main also returns their sum as `loss`; false changes the official objective
processor_use_fast: false
cast_stream_dtype: true
nan_to_num_cost: true
ego_keypoints:                 # the official Bench2Drive config's ego query
  num_learnable_pts: 12
  fix_scale: [[0.45, 0.0, 0.0]]
