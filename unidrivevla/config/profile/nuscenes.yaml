# nuScenes main checkpoint frame: raw LiDAR axes, with the LiDAR origin preserved.
name: nuscenes
ddp_reduce_dtype: bf16         # main's adam_zero1_bf16.json communication_data_type
train_precision: bf16
ddp_cast_frozen_parameters: true  # match main's floating-parameter cast; buffers retain their loaded dtype
ar_loss_weight: 0.1           # nuScenes main head default
lr_microstep: true            # match main's LR hook, which updates before every data micro-batch
official_command_text: true   # reproduce main's one-hot flatten read; false is an explicit ablation
frame: lidar
cameras: [front, front_left, front_right, back_left, back_right, back]
view_tokens: ["<FRONT_VIEW>", "<FRONT_LEFT_VIEW>", "<FRONT_RIGHT_VIEW>", "<BACK_LEFT_VIEW>", "<BACK_RIGHT_VIEW>", "<BACK_VIEW>"]
horizon: 6
motion_steps: 12
commands: [right, left, straight]
command_prompts: ["TURN RIGHT ", "TURN LEFT  ", "GO STRAIGHT"]
status_layout: [acc_x, acc_y, acc_z, rot_x, rot_y, rot_z, vel_x, vel_y, vel_z, steer]
det_classes: [car, truck, construction_vehicle, bus, trailer, barrier, motorcycle, bicycle, pedestrian, traffic_cone]
# slack past the 55 m lidar-frame circle (applied in data/nuscenes.py): after lidar2ego's roll a kept
# box's ego xy can sit just outside ±55, and an ego-frame radius is not the CircleObjectRangeFilter
box_range: [-80.0, -80.0, 80.0, 80.0]
box_radius: null
reverse_classes: [barrier]
yawless_classes: [traffic_cone]
map_classes: [ped_crossing, divider, boundary]
map_roi: [30.0, 60.0]       # official roi_size=(30, 60), in native LiDAR coordinate order
map_clip: false                # the extractor's lines are cut to the LiDAR-frame ROI; VectorizeMap does not cut again
ground_height: -1.84023
ego_box: [0.0, 0.5, -1.06, 4.08, 1.73, 1.56, 0.0] # EgoInstanceBank anchor_type='nus'
motion_velocity_weight: 0.5    # the official stage 2's detection reg_weights (Bench2Drive's keeps 0)
train_resize: 0.6              # its data_aug_conf resize_lim: 1600 x 900 -> 960 x 540, cropped to image_hw
occ_classes: 18
occ_format: occ3d
anchors_dir: ${oc.env:UNIDRIVE_NATIVE_ANCHORS_ROOT,/data/yongkangli/UniDriveVLA/anchors}/native/nuscenes
delta_mean: [0.0233, 2.2707]   # official FlowPlanningLoss delta_mu, raw LiDAR order
delta_std: [0.3427, 1.8668]
prefix_max_len: 3740           # fixed length used by the official nuScenes main; PAD positions stay visible
official_attention_mask: true  # main FlexAttention attends to fixed-length PAD positions
