# @package _global_
# The offline converter requires an explicit, disjoint list of official LEAD log names for each split.
defaults:
  - /profile@profile: lead
  - _self_

data_loader: lead
lead:
  cache_root: ${oc.env:LEAD_CACHE_ROOT,/data/yongkangli/LEAD/unidrivevla_cache}
  train_split: train
  val_split: val
  test_split: test

train:
  max_epochs: 10
  ema_decay: 0.0
stage2_max_epochs: 0
augment: null

# UniDriveVLA computes planning L2 on validation targets; LEAD closed-loop CARLA scoring remains separate.
evaluator:
  name: lead
  every_n_epochs: 0
  on_end: true
