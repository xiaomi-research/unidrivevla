[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "unidrivevla"
version = "0.1.0"
description = "Qwen3-VL driving policies with native PyTorch multi-source training and benchmark adapters."
readme = "README.md"
requires-python = ">=3.9"
# torch / torchvision are pinned exactly in requirements.txt (2.6.0+cu124, 0.21.0+cu124).
# A local version satisfies >= but not ==, so these floors do not replace a CUDA build.
dependencies = [
    "torch>=2.6.0",
    "torchvision>=0.21.0",
    "transformers==4.57.6",
    "peft==0.17.1",
    "accelerate==1.10.1",
    "hydra-core==1.2.0",
    "omegaconf==2.3.1",
    "numpy==1.26.4",
    "einops==0.8.2",
    "timm==1.0.29",
    "safetensors==0.7.0",
    "qwen-vl-utils==0.0.14",
    "opencv-python-headless==4.11.0.86",
    "pillow==11.3.0",
    "shapely==2.0.7",
    "scipy==1.13.1",
    "scikit-learn==1.6.1",
    "scikit-image==0.24.0",
    "pyquaternion==0.9.9",
    "packaging==26.3",
    "tqdm==4.70.0",
]

[project.optional-dependencies]
flash = ["flash-attn==2.7.4.post1"]
data = [
    "mmcv==1.7.2",
    "nuscenes-devkit==1.1.10",
]

[tool.setuptools]
package-dir = { "unidrivevla" = "." }
packages = [
    "unidrivevla",
    "unidrivevla.adapters",
    "unidrivevla.closedloop",
    "unidrivevla.data",
    "unidrivevla.distributed",
    "unidrivevla.eval",
    "unidrivevla.models",
    "unidrivevla.models.core",
    "unidrivevla.models.losses",
    "unidrivevla.models.models",
    "unidrivevla.models.models.detection3d",
    "unidrivevla.models.models.ego",
    "unidrivevla.models.models.map",
    "unidrivevla.models.models.motion",
    "unidrivevla.models.ops",
    "unidrivevla.models.unidrivevla",
    "unidrivevla.models.unidrivevla.dense_heads",
    "unidrivevla.models.unidrivevla.vae",
    "unidrivevla.train",
]
include-package-data = true

[tool.setuptools.package-data]
unidrivevla = [
    "config/*.yaml",
    "config/*/*.yaml",
    "models/ops/setup.py",
    "models/ops/src/*.cpp",
    "models/ops/src/*.cu",
    "tools/data_converter/*.py",
    "tools/data_converter/map_utils/*.py",
    "scripts/train/*.sh",
    "scripts/infer/*.sh",
    "tools/*.py",
    "docs/*.md",
]
